<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ping Pong - Navegador</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        canvas {
            background-color: #000;
            border: 4px solid #ffffff;
            display: block;
        }
        .controls {
            margin-top: 15px;
            text-align: center;
            color: #aaa;
            font-size: 14px;
        }
        .controls span {
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="pongCanvas" width="800" height="500"></canvas>
    </div>

    <div class="controls">
        <p><strong>Jogador Azul (Esq):</strong> Teclas <span>W</span> (Sobe) e <span>S</span> (Desce)</p>
        <p><strong>Jogador Vermelho (Dir):</strong> Teclas <span>Seta Cima</span> e <span>Seta Baixo</span></p>
        <p><strong>Iniciar Saque / Reiniciar:</strong> Pressione <span>Barra de Espaço</span></p>
    </div>

    <script>
        const canvas = document.getElementById("pongCanvas");
        const ctx = canvas.getContext("2d");

        // Estado do Jogo
        let score1 = 0;
        let score2 = 0;
        let sets1 = 0;
        let sets2 = 0;
        const MAX_SETS = 2;

        let currentServer = Math.random() < 0.5 ? 1 : 2;
        let gameState = "SERVE"; // "SERVE", "RALLY", "GAME_OVER"
        let statusMessage = "Pressione ESPAÇO para sacar";

        // Teclas pressionadas
        const keys = {};

        // Raquetes
        const paddleWidth = 12;
        const paddleHeight = 90;

        const player1 = {
            x: 20,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            color: "#3498db",
            speed: 7
        };

        const player2 = {
            x: canvas.width - 20 - paddleWidth,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            color: "#e74c3c",
            speed: 7
        };

        // Bola
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: 10,
            speedX: 0,
            speedY: 0,
            baseSpeed: 5
        };

        // Escuta de teclado
        window.addEventListener("keydown", (e) => {
            keys[e.code] = true;

            if (e.code === "Space") {
                if (gameState === "SERVE") {
                    startServe();
                } else if (gameState === "GAME_OVER") {
                    resetFullGame();
                }
            }
        });

        window.addEventListener("keyup", (e) => {
            keys[e.code] = false;
        });

        function startServe() {
            gameState = "RALLY";
            statusMessage = "";
            const dirX = currentServer === 1 ? 1 : -1;
            const dirY = Math.random() < 0.5 ? 1 : -1;
            ball.speedX = dirX * ball.baseSpeed;
            ball.speedY = dirY * (ball.baseSpeed * 0.7);
        }

        function checkServerSwitch() {
            const totalPoints = score1 + score2;
            if (score1 >= 10 && score2 >= 10) {
                currentServer = currentServer === 1 ? 2 : 1;
            } else if (totalPoints % 2 === 0) {
                currentServer = currentServer === 1 ? 2 : 1;
            }
        }

        function resetBall() {
            gameState = "SERVE";
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speedX = 0;
            ball.speedY = 0;
            const serverName = currentServer === 1 ? "Azul (Esq)" : "Vermelho (Dir)";
            statusMessage = `Saque: Jogador ${serverName} | Espaço para sacar`;
        }

        function awardPoint(winner) {
            if (winner === 1) score1++;
            else score2++;

            checkServerSwitch();

            // Regra dos 11 pontos com diferença mínima de 2
            if ((score1 >= 11 || score2 >= 11) && Math.abs(score1 - score2) >= 2) {
                if (score1 > score2) sets1++;
                else sets2++;

                score1 = 0;
                score2 = 0;

                if (sets1 === MAX_SETS || sets2 === MAX_SETS) {
                    gameState = "GAME_OVER";
                    const winnerName = sets1 > sets2 ? "JOGADOR AZUL" : "JOGADOR VERMELHO";
                    statusMessage = `${winnerName} VENCEU O JOGO! (Espaço para reiniciar)`;
                    return;
                }
            }

            resetBall();
        }

        function resetFullGame() {
            score1 = 0;
            score2 = 0;
            sets1 = 0;
            sets2 = 0;
            currentServer = Math.random() < 0.5 ? 1 : 2;
            resetBall();
        }

        function update() {
            // Movimentação do Jogador 1 (W / S)
            if (keys["KeyW"] && player1.y > 0) {
                player1.y -= player1.speed;
            }
            if (keys["KeyS"] && player1.y < canvas.height - player1.height) {
                player1.y += player1.speed;
            }

            // Movimentação do Jogador 2 (Setas Cima / Baixo)
            if (keys["ArrowUp"] && player2.y > 0) {
                player2.y -= player2.speed;
            }
            if (keys["ArrowDown"] && player2.y < canvas.height - player2.height) {
                player2.y += player2.speed;
            }

            // Movimento da Bola durante o Rali
            if (gameState === "RALLY") {
                ball.x += ball.speedX;
                ball.y += ball.speedY;

                // Colisão com parede Superior/Inferior
                if (ball.y - ball.size < 0 || ball.y + ball.size > canvas.height) {
                    ball.speedY *= -1;
                }

                // Colisão com Raquete 1 (Esquerda)
                if (
                    ball.x - ball.size <= player1.x + player1.width &&
                    ball.y >= player1.y &&
                    ball.y <= player1.y + player1.height &&
                    ball.speedX < 0
                ) {
                    ball.speedX *= -1.08; // Aumenta velocidade
                }

                // Colisão com Raquete 2 (Direita)
                if (
                    ball.x + ball.size >= player2.x &&
                    ball.y >= player2.y &&
                    ball.y <= player2.y + player2.height &&
                    ball.speedX > 0
                ) {
                    ball.speedX *= -1.08;
                }

                // Ponto para o Jogador 2 (Bola passou da esquerda)
                if (ball.x < 0) {
                    awardPoint(2);
                }

                // Ponto para o Jogador 1 (Bola passou da direita)
                if (ball.x > canvas.width) {
                    awardPoint(1);
                }
            }
        }

        function draw() {
            // Limpa a tela
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Rede central
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.strokeStyle = "#444444";
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.setLineDash([]);

            // Raquetes
            ctx.fillStyle = player1.color;
            ctx.fillRect(player1.x, player1.y, player1.width, player1.height);

            ctx.fillStyle = player2.color;
            ctx.fillRect(player2.x, player2.y, player2.width, player2.height);

            // Bola
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.size, 0, Math.PI * 2);
            ctx.fill();

            // Placar de Sets e Pontos
            ctx.font = "bold 16px 'Segoe UI', sans-serif";
            ctx.fillStyle = "#3498db";
            ctx.fillText(`SETS: ${sets1}`, 180, 30);
            ctx.font = "bold 28px 'Segoe UI', sans-serif";
            ctx.fillText(`${score1}`, 190, 65);

            ctx.font = "bold 16px 'Segoe UI', sans-serif";
            ctx.fillStyle = "#e74c3c";
            ctx.fillText(`SETS: ${sets2}`, canvas.width - 240, 30);
            ctx.font = "bold 28px 'Segoe UI', sans-serif";
            ctx.fillText(`${score2}`, canvas.width - 210, 65);

            // Mensagem de Status
            if (statusMessage) {
                ctx.font = "bold 18px 'Segoe UI', sans-serif";
                ctx.fillStyle = "#f1c40f";
                ctx.textAlign = "center";
                ctx.fillText(statusMessage, canvas.width / 2, canvas.height - 30);
                ctx.textAlign = "left";
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        resetBall();
        gameLoop();
    </script>
</body>
</html>
